# Русские названия, описания и категории для растений из Perenual.
# Ключ: научное название. Заполните name (обязательно для перевода), при желании category
# (одна из: Комнатные растения, Суккуленты и кактусы, Цветущие растения, Папоротники и пальмы)
# и description. Пустые поля игнорируются. После правки: python scripts/perenual_bulk.py names-apply
#
# Заготовки для скачанных растений добавляет команда: python scripts/perenual_bulk.py names-export
# Пример записи:
#   Monstera adansonii:
#     english: Swiss Cheese Vine
#     name: Монстера Адансона
#     category: Комнатные растения
#     description: Лиана с овальными листьями, в которых прорезаны отверстия.
