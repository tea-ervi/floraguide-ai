# Причины (диагнозы), рекомендации и источники.
# Источники указаны как ориентиры, по которым составлен перечень причин. Формулировки шагов написаны
# своими словами: перед защитой проекта сверьте их со справочниками и поправьте.

sources:
  rhs_poorly:
    title: "RHS: How to help a poorly houseplant"
    url: "https://www.rhs.org.uk/plants/types/houseplants/how-to-help-a-poorly-houseplant"
  rhs_leaf_damage:
    title: "RHS: Leaf damage on houseplants"
    url: "https://www.rhs.org.uk/prevention-protection/leaf-damage-on-houseplants"
  ucipm_houseplants:
    title: "UC IPM: Houseplant Problems"
    url: "https://ipm.ucanr.edu/home-and-landscape/houseplant-problems/"
  gi_top10:
    title: "Gardens Illustrated: The 10 most common house plant problems"
    url: "https://www.gardensillustrated.com/plants/house-plants/common-house-plant-problems-solved"

causes:
  overwatering:
    name: "Переувлажнение (слишком частый или обильный полив)"
    urgency: high
    summary: "Корни постоянно стоят во влажной земле и не получают воздуха. Это одна из самых частых причин проблем у комнатных растений."
    steps:
      - "Не поливайте, пока верхние 2-3 см земли не просохнут."
      - "Убедитесь, что в горшке есть дренажные отверстия, и слейте воду из поддона."
      - "Осмотрите корни: здоровые светлые и упругие. Если часть корней тёмная и мягкая, срежьте её и пересадите растение в свежий сухой грунт."
      - "Выберите интервал полива по рекомендации для вида и учитывайте сезон: зимой поливают реже."
    sources: [rhs_poorly, ucipm_houseplants, gi_top10]

  root_rot:
    name: "Гниль корней"
    urgency: high
    summary: "Корни и основание стебля размягчаются и темнеют. Растение перестаёт получать воду, поэтому вянет даже при влажной земле."
    steps:
      - "Достаньте растение из горшка и осмотрите корни."
      - "Чистым острым ножом срежьте тёмные, мягкие и дурно пахнущие корни и повреждённые части стебля."
      - "Пересадите растение в чистый горшок с дренажными отверстиями и свежим рыхлым грунтом."
      - "Первые 1-2 недели поливайте очень умеренно."
      - "Если мягким стало всё основание стебля, попробуйте укоренить здоровую верхушку черенком."
    sources: [rhs_poorly, ucipm_houseplants]

  underwatering:
    name: "Недостаток воды"
    urgency: medium
    summary: "Земля пересыхает, и растение теряет тургор: листья обвисают, желтеют и сохнут."
    steps:
      - "Полейте растение медленно, пока вода не начнёт выходить из дренажных отверстий."
      - "Если земля отошла от стенок горшка и вода быстро стекает, поставьте горшок в ёмкость с водой на 15-30 минут (нижний полив)."
      - "Слейте лишнюю воду из поддона."
      - "Поливайте по графику: и пересыхание, и последующее «затопление» вредят растению."
    sources: [rhs_leaf_damage, rhs_poorly]

  low_light:
    name: "Недостаток света"
    urgency: low
    summary: "Растение тянется к свету, теряет яркость окраски и растёт слабо."
    steps:
      - "Переставьте растение ближе к окну, избегая прямого полуденного солнца."
      - "Зимой при нехватке естественного света добавьте досветку фитолампой."
      - "Протирайте листья от пыли: она задерживает свет."
      - "Обрежьте сильно вытянутые побеги, чтобы растение ветвилось."
    sources: [rhs_poorly, gi_top10]

  sunburn:
    name: "Солнечный ожог"
    urgency: medium
    summary: "Прямое полуденное солнце выжигает ткань листа: появляются светлые или бурые сухие участки."
    steps:
      - "Уберите растение с прямого полуденного солнца или притените окно лёгкой шторой."
      - "Обожжённые участки не восстановятся: сильно повреждённые листья можно срезать."
      - "Приучайте растение к яркому свету постепенно."
    sources: [rhs_leaf_damage, rhs_poorly]

  low_humidity:
    name: "Сухой воздух"
    urgency: low
    summary: "Воздух слишком сухой, особенно в отопительный сезон. Кончики и края листьев подсыхают и буреют."
    steps:
      - "Поставьте рядом увлажнитель воздуха или поддон с влажной галькой (дно горшка не должно стоять в воде)."
      - "Уберите растение от батареи и обогревателя."
      - "Сгруппируйте растения и регулярно протирайте листья. Опрыскивание даёт лишь краткий эффект."
      - "Подсохшие кончики можно аккуратно срезать по форме листа."
    sources: [rhs_poorly, ucipm_houseplants, gi_top10]

  spider_mites:
    name: "Паутинный клещ"
    urgency: high
    summary: "Мельчайшие вредители сосут сок листьев: на них появляются светлые точки, а позже паутинка. Клещи любят сухой тёплый воздух."
    steps:
      - "Изолируйте растение от остальных."
      - "Промойте листья (в том числе снизу) тёплым душем или протрите влажной тканью."
      - "Повысьте влажность воздуха."
      - "Повторяйте обработку каждые 3-5 дней в течение 2-3 недель."
      - "При сильном заражении выберите препарат, разрешённый для комнатных растений, и следуйте инструкции на упаковке. Храните средства вдали от детей и животных."
    sources: [rhs_leaf_damage, rhs_poorly]

  mealybugs:
    name: "Мучнистый червец"
    urgency: high
    summary: "Насекомые покрываются белым ватным налётом и скапливаются в пазухах листьев и на стеблях."
    steps:
      - "Изолируйте растение от остальных."
      - "Снимите насекомых ватной палочкой, смоченной в мыльном растворе. Спирт сначала проверьте на небольшом листе."
      - "Осмотрите пазухи листьев и поверхность земли."
      - "Повторяйте осмотр и обработку раз в неделю несколько недель."
      - "При сильном заражении используйте препарат, разрешённый для комнатных растений, по инструкции. Храните вдали от детей и животных."
    sources: [rhs_poorly, rhs_leaf_damage]

  scale_insects:
    name: "Щитовка"
    urgency: high
    summary: "Вредители под твёрдыми коричневыми щитками сидят на стеблях и листьях и выделяют липкую жидкость."
    steps:
      - "Изолируйте растение."
      - "Соскоблите щитки мягкой щёткой или ватной палочкой с мыльным раствором."
      - "Протрите липкий налёт на листьях и поверхностях рядом."
      - "Повторяйте обработку раз в неделю несколько недель."
      - "При сильном заражении используйте препарат, разрешённый для комнатных растений, по инструкции. Храните вдали от детей и животных."
    sources: [rhs_poorly, rhs_leaf_damage]

  fungus_gnats:
    name: "Грибные комарики (сциариды)"
    urgency: medium
    summary: "Мелкие мошки летают над горшком, личинки живут в сырой земле. Обычно это следствие постоянно влажного грунта."
    steps:
      - "Дайте верхнему слою земли просохнуть между поливами."
      - "Уберите воду из поддона."
      - "Используйте жёлтые клейкие ловушки для взрослых мошек."
      - "При большом количестве личинок замените верхний слой грунта на 3-5 см."
    sources: [gi_top10]

  aphids:
    name: "Тля"
    urgency: medium
    summary: "Мелкие насекомые сосут сок молодых побегов, листья деформируются и становятся липкими."
    steps:
      - "Изолируйте растение."
      - "Смойте насекомых струёй воды или протрите листья мыльным раствором."
      - "Срежьте сильно деформированные побеги."
      - "Осматривайте растение каждые несколько дней."
    sources: [rhs_leaf_damage, rhs_poorly]

  fungal_disease:
    name: "Грибковое заболевание листьев (пятнистость, мучнистая роса, плесень)"
    urgency: medium
    summary: "Грибки поражают листья: появляются тёмные пятна, белый или серый налёт. Им благоприятны сырость и застоявшийся воздух."
    steps:
      - "Уберите сильно поражённые листья и выбросьте их, не оставляя в горшке."
      - "Поливайте под корень, не мочите листья, обеспечьте проветривание без сквозняка."
      - "Не допускайте постоянного переувлажнения земли."
      - "При сильном поражении используйте препарат, разрешённый для комнатных растений, по инструкции. Храните вдали от детей и животных."
    sources: [rhs_poorly, ucipm_houseplants]

  cold_stress:
    name: "Холодовой стресс или сквозняк"
    urgency: medium
    summary: "Холодный воздух и перепады температуры вызывают потерю листьев, потемнение молодых побегов и поникание."
    steps:
      - "Уберите растение от сквозняков, холодных стёкол, дверей и кондиционера."
      - "Зимой не допускайте касания листьев холодного стекла."
      - "Поддерживайте стабильную температуру. Требования вашего вида проверьте в справочнике или на этикетке."
    sources: [rhs_poorly, ucipm_houseplants]

  transplant_stress:
    name: "Стресс после покупки, пересадки или смены места"
    urgency: low
    summary: "Растению нужно время, чтобы привыкнуть к новым условиям: оно может ронять листья и вянуть."
    steps:
      - "Оставьте растение на новом месте и не переставляйте его повторно."
      - "Поливайте умеренно и 3-4 недели не подкармливайте."
      - "Не обрезайте листья сразу: подождите несколько недель и посмотрите на новые."
    sources: [ucipm_houseplants, gi_top10]

  natural_aging:
    name: "Естественное старение листьев"
    urgency: low
    summary: "Нижние листья у взрослого растения со временем желтеют и опадают. Если это единичные листья, повода для тревоги нет."
    steps:
      - "Полностью пожелтевшие нижние листья можно срезать."
      - "Продолжайте обычный уход."
      - "Если жёлтых листьев становится больше, проверьте полив и освещение."
    sources: [rhs_leaf_damage]

  nutrient_deficiency:
    name: "Недостаток питания"
    urgency: low
    summary: "В активный рост растению не хватает питательных веществ: листья бледнеют, рост замедляется."
    steps:
      - "Весной и летом подкармливайте растение комплексным удобрением для комнатных растений по инструкции."
      - "Не подкармливайте больные, пересохшие или только что пересаженные растения."
      - "Если корни вылезают из дренажных отверстий, пересадите растение в горшок на 2-3 см больше."
    sources: [rhs_leaf_damage, gi_top10]
