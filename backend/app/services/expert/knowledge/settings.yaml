# Настройки экспертной системы. Значения здесь это ДОПУЩЕНИЯ: проверьте их по источникам
# и подбирайте тестами (python scripts/evaluate_expert.py).

# Сезоны по номеру месяца (северное полушарие)
seasons:
  winter: [12, 1, 2]
  spring: [3, 4, 5]
  summer: [6, 7, 8]
  autumn: [9, 10, 11]

growing_months: [3, 4, 5, 6, 7, 8]            # период активного роста
heating_months: [10, 11, 12, 1, 2, 3, 4]      # отопительный сезон: воздух в квартире суше

# Во сколько раз меняется интервал полива в зависимости от сезона.
# Допущение: зимой растения растут медленнее и расходуют меньше воды, суккуленты особенно.
interval_factors:
  winter: {default: 1.3, succulent: 1.8}
  spring: {default: 1.0, succulent: 1.0}
  summer: {default: 1.0, succulent: 1.0}
  autumn: {default: 1.1, succulent: 1.3}

# Пороги, по которым считаются факты о контексте растения
thresholds:
  recently_watered: 0.5     # полили не позже, чем через долю интервала
  watering_due: 1.0         # пора поливать: прошёл весь интервал
  watering_overdue: 1.3     # полив просрочен: прошло больше 130% интервала
  on_time_min: 0.5          # «полив по графику»: от 50% до 120% интервала
  on_time_max: 1.2
  recently_planted_days: 30
  low_light_lux: 2000       # вид любит тень, если оптимум не выше этого значения
  bright_light_lux: 4000    # вид любит яркий свет, если оптимум не ниже
  humid_species_percent: 60 # вид любит влажный воздух

# Поведение диалога
dialog:
  confirm_cf: 0.6           # уверенность, при которой диагноз выдаётся сразу
  min_lead: 0.15            # минимальный отрыв лидера от второй гипотезы
  min_report_cf: 0.3        # ниже этого порога система говорит, что не уверена
  max_questions: 3          # сколько уточняющих вопросов можно задать подряд
