services:
  db:
    image: pgvector/pgvector:pg18
    container_name: floraguide_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: floraguide_db
    ports:
      - "5433:5432"
    volumes:
      - floraguide_pgdata:/var/lib/postgresql

volumes:
  floraguide_pgdata: