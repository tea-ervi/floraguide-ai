    question: "Как плесень попала во второй ящик?"
    options:
      - id: a
        text: "Плесень сама прорастает из воздуха в любом ящике, поэтому руки и нож тут ни при чём, это просто невезение и стечение обстоятельств."
        correct: false
        feedback: "Споры в воздухе есть, но перенос руками и инструментом резко повышает риск и остаётся частым путём заражения."
