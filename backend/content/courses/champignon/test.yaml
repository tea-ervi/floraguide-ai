# Тест на причинно-следственные связи. Ответов в конспекте нет в готовом виде: нужно применить несколько фактов.
# У каждого варианта есть feedback. Для неверного это объяснение, почему он не подходит, для верного это разбор.
title: "Тест: что произойдёт и почему"
questions:
  - id: q1
    topic: "Питание гриба"
    situation: "Ящик с компостом, в котором мицелий уже хорошо разросся, стоит в тёмной кладовой. Знакомый уверен, что «растениям нужен свет», и предлагает перенести ящик на солнечный подоконник."
    question: "Как это скажется на ящике и почему?"
    options:
      - id: a
        text: "Мицелий начнёт использовать свет как источник энергии, как растения, и разрастётся заметно быстрее, потому что получит дополнительное питание."
        correct: false
        feedback: "У гриба нет хлорофилла, поэтому свет не заменит пищу. Энергию мицелий получает, разлагая органические вещества компоста."
      - id: b
        text: "Свет сразу убьёт мицелий: внутри компоста он живёт только в полной темноте, и любое освещение разрушает его нити."
        correct: false
        feedback: "Мицелий сидит внутри компоста, куда свет почти не проникает, и сам по себе свет ему не вреден. Опасность подоконника в другом."
      - id: c
        text: "Питания не прибавится, а на солнце ящик нагреется и пересохнет, что скорее навредит."
        correct: true
        feedback: "Верно. Энергию гриб берёт из органики компоста, а не из света. Зато солнце нагревает ящик и сушит поверхность, а мицелию нужны умеренное тепло и влага."
      - id: d
        text: "Свет нужен лишь для окраски шляпок и на рост мицелия не влияет, поэтому вынос на подоконник ничем не грозит ящику."
        correct: false
        feedback: "Цвет шляпок не создаётся светом. И вывод «не влияет» неверен: на солнце ящик рискует перегреться и пересохнуть."

  - id: q2
    topic: "Компост"
    situation: "Вы приготовили компост и сразу, пока он ещё горячий и резко пахнет аммиаком, перемешали его с посевным мицелием. Через неделю белой сети нет, а местами компост выглядит пустым."
    question: "Какое объяснение самое вероятное?"
    options:
      - id: a
        text: "Мицелий пострадал от жара и аммиака: компост нужно было выдержать и остудить."
        correct: true
        feedback: "Верно. Мицелий живой и чувствителен к тепловому и химическому стрессу. Горячий компост с аммиаком для него токсичен, поэтому перед посевом его выдерживают и остужают."
      - id: b
        text: "Мицелию не хватило света, поэтому он не проявился на поверхности: после посева ящик нужно было сразу поставить к окну."
        correct: false
        feedback: "Свет не питает гриб, а мицелий растёт внутри компоста без него. Причина в состоянии самого компоста."
      - id: c
        text: "Компост слишком питателен: мицелий «объелся» и перестал расти, так что в следующий раз смесь стоит сильно разбавить."
        correct: false
        feedback: "Избыток пищи не останавливает рост мицелия. Здесь проблема в токсичных условиях, а не в количестве питания."
      - id: d
        text: "Мицелий не растёт без покровного слоя, поэтому торф с известью нужно было насыпать сразу после смешивания с мицелием."
        correct: false
        feedback: "Покровный слой наносят позже, когда мицелий уже заселил компост. Он нужен для плодоношения, а не для первичного роста."

  - id: q3
    topic: "Тепло мицелия"
    situation: "Пока мицелий заселял компост, вы плотно укутали ящик тёплым одеялом «для надёжности». За два дня термометр в центре компоста показал около 38 °C, хотя в комнате 25 °C."
    question: "Что происходит и чем это грозит?"
    options:
      - id: a
        text: "Мицелий нагревает комнату, а не себя, так что опасности нет: чем теплее, тем быстрее он растёт и тем больше будет урожай."
        correct: false
        feedback: "Тепло выделяется внутри компоста и не уходит в комнату. У роста есть верхний предел: слишком высокая температура вредит мицелию."
      - id: b
        text: "Это нормальная температура для заключительной стадии, когда мицелий готовит зачатки."
        correct: false
        feedback: "Для запуска плодоношения условия, наоборот, делают прохладнее. 38 °C означает перегрев."
      - id: c
        text: "Нагрев вызвала плесень, и достаточно добавить воды в компост, чтобы всё остудить и остановить её рост."
        correct: false
        feedback: "Нагрев объясняется работой растущего мицелия и теплоизоляцией, а не плесенью. Лишняя вода тепло не отведёт и ухудшит дыхание компоста."
      - id: d
        text: "Растущий мицелий сам выделяет тепло, одеяло его не выпускает, и при таком перегреве мицелий может погибнуть."
        correct: true
        feedback: "Верно. При дыхании мицелий выделяет тепло, и в укутанном ящике оно накапливается. Около 35 °C мицелий уже гибнет, поэтому тепло нужно отводить."

  - id: q4
    topic: "Покровный слой"
    situation: "В двух одинаковых ящиках компост полностью побелел от мицелия. В первом ящике поверхность оставили открытой, а во втором засыпали слоем влажного торфа с известью. Через несколько недель грибы пошли только во втором."
    question: "Что лучше всего объясняет разницу?"
    options:
      - id: a
        text: "Торф даёт грибам дополнительное питание, которого в одном компосте не хватает, поэтому только под ним получается урожай."
        correct: false
        feedback: "Покровный слой почти не питателен: питание гриб берёт из компоста. Разница в другом."
      - id: b
        text: "Слой создаёт на поверхности условия (влага, особые микробы), которые запускают образование зачатков."
        correct: true
        feedback: "Верно. Роль слоя не в питании, а в создании физических и микробных условий, которые участвуют в запуске формирования зачатков."
      - id: c
        text: "Торф защищает мицелий от света, а на свету плодовые тела не образуются, поэтому открытый ящик остался без грибов."
        correct: false
        feedback: "Шампиньону свет для запуска плодоношения не нужен и не мешает ему. Слой действует иначе."
      - id: d
        text: "Во втором ящике было теплее, потому что торф с известью греет компост, а для плодоношения нужно именно тепло."
        correct: false
        feedback: "Торф компост не греет. Разница связана с условиями на поверхности, которые нужны для запуска плодоношения."

  - id: q5
    topic: "Вода для зачатков"
    situation: "На покровном слое появились мелкие белые бугорки. Но из-за сухого воздуха и редкого полива поверхность потрескалась и посветлела, а через несколько дней бугорки потемнели и перестали расти."
    question: "Почему зачатки погибли?"
    options:
      - id: a
        text: "Им не хватило света: без него зачатки не могут расти, поэтому бугорки потемнели и остановились в росте."
        correct: false
        feedback: "Зачатки растут без света: у гриба нет фотосинтеза, и свет в его питании не участвует."
      - id: b
        text: "В покровном слое слишком много воды, зачатки захлебнулись и загнили, поэтому они потемнели."
        correct: false
        feedback: "Признаки обратные: потрескавшаяся и посветлевшая поверхность говорит о высыхании, а не об избытке воды."
      - id: c
        text: "Растущим зачаткам нужна вода из покровного слоя: когда он пересох, влаги стало не хватать."
        correct: true
        feedback: "Верно. Зачатки состоят в основном из воды и берут её из покровного слоя. Пересохший слой остаётся частой причиной гибели зачатков."
      - id: d
        text: "Это была плесень, а не зачатки: она всегда темнеет на поверхности, когда слой подсыхает."
        correct: false
        feedback: "Плесень охотнее разрастается во влажном слое, а здесь все признаки говорят о пересыхании."

  - id: q6
    topic: "Смена условий"
    situation: "Мицелий густо разросся и вышел на поверхность покровного слоя. Прошло две недели, а зачатков нет. В комнате около 25 °C и душно: окна закрыты, ящик стоит у батареи."
    question: "Какое изменение условий проверить в первую очередь?"
    options:
      - id: a
        text: "Охладить ящик и дать приток свежего воздуха: смена микроклимата служит сигналом к образованию зачатков."
        correct: true
        feedback: "Верно. Мицелий растёт в тепле при обилии CO2, а зачатки образуются после охлаждения и проветривания (в производстве около 17 °C и порядка 1000 ppm CO2)."
      - id: b
        text: "Нагреть ящик ещё сильнее: для плодоношения мицелию нужно больше энергии, а значит больше тепла."
        correct: false
        feedback: "Тепло ускоряет рост мицелия, но не запускает образование зачатков. Перегрев к тому же опасен для мицелия."
      - id: c
        text: "Полить покровный слой до луж: вода запустит плодоношение, как весенний дождь запускает рост грибов в лесу."
        correct: false
        feedback: "Избыток воды ухудшает дыхание мицелия и помогает болезням, но не заменяет смену микроклимата."
      - id: d
        text: "Поставить ящик на солнечный подоконник: свет подскажет грибу, что условия сменились и пора плодоносить."
        correct: false
        feedback: "Для шампиньона решают температура и состав воздуха, а свет сигналом к плодоношению не служит."

  - id: q7
    topic: "Газообмен"
    situation: "Чтобы не терять влагу, вы накрыли ящик герметичной плёнкой. Грибы появились, но на длинных тонких ножках и с мелкими шляпками."
    question: "Что нужно изменить?"
    options:
      - id: a
        text: "Закрыть ящик ещё плотнее, чтобы сохранить как можно больше влаги: тогда ножки станут толще и крепче."
        correct: false
        feedback: "Плотная плёнка как раз мешает газообмену. Мицелий и грибы выделяют CO2, и он накапливается."
      - id: b
        text: "Поставить ящик на яркий свет: ножки вытягиваются из-за нехватки света, как у комнатных растений."
        correct: false
        feedback: "Ножки шампиньонов вытягиваются не из-за света: грибы не используют свет как растения."
      - id: c
        text: "Залить компост водой: тонкие ножки означают нехватку влаги в компосте, и после полива они окрепнут."
        correct: false
        feedback: "Нехватка воды проявилась бы иначе, например высыханием поверхности и зачатков. Вытянутая форма связана с составом воздуха."
      - id: d
        text: "Наладить газообмен: в закрытом объёме копится углекислый газ и искажает развитие грибов, а влагу держать другим способом."
        correct: true
        feedback: "Верно. При слабом проветривании накапливается CO2, который выделяет сам гриб, и плодовые тела развиваются неправильно. Влагу сохраняют иначе: увлажняют воздух и покровный слой, не герметизируя ящик."

  - id: q8
    topic: "Вода на шляпках"
    situation: "Чтобы грибы не высыхали, вы каждый вечер обильно поливаете шляпки из лейки. Воздух в комнате почти неподвижен. Через несколько дней на шляпках появились светлые, потом бурые пятна и неприятный запах."
    question: "Как полив связан с пятнами?"
    options:
      - id: a
        text: "Вода вымывает из шляпок питательные вещества, и на этих местах остаются светлые, а затем бурые пятна."
        correct: false
        feedback: "Пятна вызывают живые организмы, а не вымывание: на мокрой поверхности размножаются бактерии."
      - id: b
        text: "Вода на шляпках при слабой вентиляции долго не высыхает, и в ней размножаются бактерии."
        correct: true
        feedback: "Верно. Бактерии вроде Pseudomonas размножаются в плёнке воды и каплях на шляпках, а слабый воздухообмен не даёт поверхности просохнуть."
      - id: c
        text: "Струя из лейки повредила шляпки механически, и от ударов они потемнели и стали пахнуть."
        correct: false
        feedback: "Механические повреждения не объясняют расползающиеся пятна и запах. Причина биологическая: размножаются бактерии."
      - id: d
        text: "Пятна появились от недостатка воды: так шляпки реагируют на сухость воздуха в неподвижной комнате."
        correct: false
        feedback: "Здесь воды избыток на поверхности, а не нехватка. Сухость проявляется растрескиванием и высыханием."

  - id: q9
    topic: "Конденсат"
    situation: "Высокая влажность у ящика поддерживается, но ящик стоит у окна: ночью в комнате холодает, а днём включают обогреватель. По утрам на шляпках блестят капли, хотя вы их не поливали."
    question: "Откуда капли и чем это грозит?"
    options:
      - id: a
        text: "Грибы выделяют воду, чтобы защититься от перегрева за день: такие капли полезны, и бояться нечего."
        correct: false
        feedback: "Капли не служат защитой. Они остаются на поверхности и создают условия для размножения бактерий."
      - id: b
        text: "Это сок из повреждённых шляпок, значит, грибы пора немедленно собирать, пока они не испортились."
        correct: false
        feedback: "Капли появились на целых шляпках из-за перепадов температуры, а не из-за повреждений."
      - id: c
        text: "Влажный воздух оседает каплями на более холодной поверхности, а капли на шляпках повышают риск пятен."
        correct: true
        feedback: "Верно. Влажный воздух оседает каплями на более холодной поверхности. Влага на шляпке удобна для бактерий, поэтому перепады температуры и застой воздуха опасны."
      - id: d
        text: "Это споры гриба: ночью они выделяются в виде капель, поэтому беспокоиться не о чем, это нормальный процесс."
        correct: false
        feedback: "Споры сухие микроскопические частицы, они высыпаются из раскрывшейся шляпки, а не выделяются каплями."

  - id: q10
    topic: "Мухи"
    situation: "Вокруг ящика появились мелкие мошки, в верхнем слое видны личинки. Грибы при этом растут нормально."
    question: "Почему мошки появились именно здесь и чем они опасны?"
    options:
      - id: a
        text: "Влажный органический субстрат с мицелием привлекает мух: личинки питаются в нём, а сами мухи могут переносить возбудителей болезней."
        correct: true
        feedback: "Верно. Мухи размножаются во влажной органике и могут переносить бактерии и споры плесени на другие ящики."
      - id: b
        text: "Их привлекает свет лампы над ящиком, а личинки в верхнем слое появились случайно и к урожаю отношения не имеют."
        correct: false
        feedback: "Свет не объясняет личинок в субстрате: мухи откладывают яйца во влажный органический материал."
      - id: c
        text: "Они вылупились из спор шампиньона: это нормальная стадия развития гриба, и бороться с ними не нужно."
        correct: false
        feedback: "Мухи это насекомые, а споры это клетки гриба. Одно в другое не превращается."
      - id: d
        text: "Мошки появляются только в сухом воздухе, поэтому нужно сильнее увлажнить комнату и опрыскивать ящик."
        correct: false
        feedback: "Мухам благоприятна влажная органика, а не сухой воздух. Увлажнение комнаты проблему не решит."

  - id: q11
    topic: "Зелёная плесень"
    situation: "На поверхности компоста в одном ящике быстро разрастается зелёная плесень, и там мицелий шампиньона исчез. Соседние ящики пока чистые."
    question: "Как лучше поступить и почему?"
    options:
      - id: a
        text: "Оставить всё как есть: шампиньон победит плесень сам, если его не трогать и не нарушать условия."
        correct: false
        feedback: "Плесень конкурирует за тот же компост и растёт быстро, поэтому сама она не уступает."
      - id: b
        text: "Вынести ящик на улицу, встряхнув и хорошо перемешав компост, чтобы проветрить его и остановить плесень."
        correct: false
        feedback: "Встряхивание поднимает споры в воздух и разносит их на другие ящики и инструменты."
      - id: c
        text: "Сильно полить поражённое место, чтобы вода смыла плесень, а затем накрыть ящик плёнкой."
        correct: false
        feedback: "Влага плесени благоприятна, а брызги разносят споры. Смыть плесень водой нельзя."
      - id: d
        text: "Не вскрывая, убрать ящик в закрывающийся пакет и вынести, затем вымыть руки и инструменты."
        correct: true
        feedback: "Верно. Споры лёгкие и переносятся воздухом, руками, инструментами и водой. Изоляция заражённого ящика и гигиена защищают остальные."

  - id: q12
    topic: "Сбор"
    situation: "Вы решили несколько дней не срывать грибы: «пусть вырастут покрупнее». Шляпки раскрылись, и из-под них осыпался тёмный налёт на соседние грибы и покровный слой."
    question: "Почему лучше собирать грибы раньше?"
    options:
      - id: a
        text: "Пока шляпка закрыта, гриб тяжелее и плотнее, поэтому по весу и по плотности урожай выходит больше, чем у раскрытых."
        correct: false
        feedback: "Дело не в весе: по мере раскрытия шляпки качество падает, а прибавка массы невелика."
      - id: b
        text: "После раскрытия шляпки гриб теряет качество и высыпает споры, а перезревшие шляпки расходуют влагу."
        correct: true
        feedback: "Верно. Закрытая шляпка означает плотный гриб, а раскрывшийся хуже по качеству, рассеивает споры и забирает влагу."
      - id: c
        text: "Раскрытая шляпка означает, что гриб заражён, и такой гриб вскоре заразит весь ящик целиком."
        correct: false
        feedback: "Раскрытие шляпки это естественная стадия созревания, а не признак заражения."
      - id: d
        text: "Высыпавшиеся споры ядовиты, и грибы после этого есть нельзя, их нужно сразу выбросить."
        correct: false
        feedback: "Споры шампиньона не делают гриб ядовитым. Проблема в потере качества и вкуса переросших грибов."

  - id: q13
    topic: "Волны урожая"
