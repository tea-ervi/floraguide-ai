        text: "Плесень переползла по полу, потому что ящики стояли рядом, и она растёт по любой влажной поверхности."
        correct: false
        feedback: "Плесень не «переползает» между ящиками: её переносят споры с воздухом, водой, руками, инструментами и насекомыми."
      - id: c
        text: "Во втором ящике было слишком сухо, и плесень возникла именно из-за сухости компоста и воздуха."
