        text: "Споры перенесены руками и ножом с одного ящика на другой: возбудители передаются контактом, водой, воздухом."
        correct: true
        feedback: "Верно. Споры лёгкие и цепляются за руки и инструменты. Мытьё рук и чистые инструменты прерывают передачу."
