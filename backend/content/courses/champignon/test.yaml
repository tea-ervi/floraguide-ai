    question: "Какой вывод о причине спада самый обоснованный?"
    options:
      - id: a
        text: "Запас питательных веществ в компосте расходуется с каждой волной, воду его не восполнит, а избыток воды повысил риск болезней."
        correct: true
        feedback: "Верно. Мицелий питается компостом, и с каждой волной его остаётся меньше. Вода питание не заменяет, а мокрая поверхность увеличивает риск пятен."
      - id: b
        text: "Мицелий привык к условиям и стал давать меньше из-за однообразия, поэтому ящику нужна смена обстановки и места."
        correct: false
        feedback: "У мицелия нет «привыкания к однообразию». Причина в расходе запасов компоста."
      - id: c
