    options:
      - id: a
        text: "Мицелий не может погибнуть, пока ящик стоит в тёплом месте, поэтому пауза означает только скорую смену ящика."
        correct: false
        feedback: "Мицелий может погибнуть, например от перегрева, плесени или пересыхания. Но пауза сама по себе ещё не признак гибели."
      - id: b
        text: "После первой волны мицелий засыпает и просыпается только после повторной засыпки покровного слоя."
        correct: false
        feedback: "Повторно слой вносить не нужно: плодоношение возобновляется само при подходящих условиях."
      - id: c
        text: "Грибы появляются волнами: между ними мицелию нужно время на подготовку зачатков, поэтому пауза нормальна."
        correct: true
        feedback: "Верно. Грибы появляются циклами с перерывами. Если нет плесени и пересыхания, нужно подождать и поддерживать условия."
